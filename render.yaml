# Named jakebox-eu (not jakebox) and pinned to Frankfurt so this Blueprint
# deploy creates a brand-new service/database pair in the right region
# instead of colliding with the pre-existing "jakebox" service in Oregon
# (created manually, pre-Blueprint). Rename once the Oregon one is retired.
services:
  - type: web
    name: jakebox-eu
    region: frankfurt
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    disk:
      name: jakebox-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATABASE_URL
        fromDatabase:
          name: jakebox-eu-db
          property: connectionString
      - key: TREBLO_API_KEY
        sync: false
      - key: TREBLO_MODEL_VERSION
        sync: false
      - key: MUREKA_API_KEY
        sync: false
      - key: MUSICAPI_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SIGNUP_BONUS_CREDITS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: VIDEO_STUDIO_URL
        value: https://music-lab-2coi.onrender.com
      - key: OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false

databases:
  - name: jakebox-eu-db
    region: frankfurt
    plan: free
